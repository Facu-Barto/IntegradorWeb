<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <!--Enlace a los estilos CSS.-->
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
    
</body>

<footer class="footer-del-sitio">
    <div class="footer-container">
        <!--Columna 1 de footer: logo y marca-->
        <div class="footer-columna">
            <div class="caja-de-marca">
                <div class="caja-logo-footer">
                    <img src="img/logo.png" alt="Logo De Sonido Montañez Medina" id="logo-footer">
                </div>
                <h3 class="titulo-marca">Sonido Montañez Medina</h3>
            </div>
            <span class="footer-texto">Música e iluminación profesional para tu evento</span>
        </div>

        <!--Columna 2 de footer: Contacto y Ubicación-->
        <div class="footer-columna">
            <h4 class="footer-contacto-y-ubicacion">Contacto & Ubicación</h4>
            <ul class="footer-list">
                <!--Ubicacion-->
                <li class="contacto-item">
                    <div class="caja-icon">
                        <img src="img/Iconos/UbicacionIcon.png" alt="Ubicación" class="footer-icon" >
                    </div>
                    <span>Villa Mercedes, San Luis, Argentina</span>
                    <img src="img/Iconos/ArgentinaIcon.png" alt="Bandera Argentina" class="footer-icon-argentina">
                </li>
                <!--Instagram-->
                <li class="contacto-item">
                    <a href="https://www.instagram.com/montanez.medina.sonido/" target="_blank" rel="noopener">
                        <div class="caja-icon">
                            <img src="img/Iconos/igIcon.png" alt="Instagram" class="footer-icon">
                        </div>
                        <span>montanez.medina.sonido</span>
                    </a>
                </li>
                <!--WhatsApp-->
                <li class="contacto-item">
                    <a href="https://api.whatsapp.com/send/?phone=2657217327&text&type=phone_number&app_absent=0" target="_blank" rel="noopener">
                        <div class="caja-icon">
                            <img src="img/Iconos/WhatsappIcon.png" alt="WhatsApp" class="footer-icon">
                        </div>
                        <span>+54 9 2657 21 7327</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <!--Seccion de copyright-->
    <div class="footer-bottom">
        <p>© 2026 DJ & Sonido. Todos los derechos reservados.</p>
    </div>
</footer>
